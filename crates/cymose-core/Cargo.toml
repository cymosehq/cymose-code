[package]
name = "cymose-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Session graph, model router and agent loop shared by the Cymose Code clients"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
toml = "1.0.7"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
