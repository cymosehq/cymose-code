name: release

# Tag-driven. `git tag v0.1.0-beta.1 && git push --tags` builds every binary,
# packages the extension, and publishes one release with all of it attached.
# Nothing here runs on a normal push: a release should be a decision, not a
# side effect of merging.
on:
  push:
    tags: ["v*"]
  # Lets you rehearse the whole thing without creating a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cymose

      # Tarballs on Unix, zip on Windows — the install script and PowerShell
      # each expect their platform's convention, and a .tar.gz on Windows is a
      # second dependency for no reason.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cymose-${{ matrix.target }}.tar.gz cymose
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../cymose-${{ matrix.target }}.zip cymose.exe

      - uses: actions/upload-artifact@v4
        with:
          name: cymose-${{ matrix.target }}
          path: cymose-${{ matrix.target }}.*
          if-no-files-found: error

  extension:
    name: vsix
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The extension ships the core inside it, so a user installs one thing.
      # Every platform's binary goes in: VS Code Marketplace serves one vsix to
      # everyone, and picking per-platform packages would mean four listings.
      - name: Bundle the binaries
        run: |
          mkdir -p extension/bin
          for f in artifacts/*/*.tar.gz; do tar xzf "$f" -C extension/bin; mv extension/bin/cymose "extension/bin/$(basename "$(dirname "$f")")"; done
          for f in artifacts/*/*.zip; do unzip -o "$f" -d extension/bin; mv extension/bin/cymose.exe "extension/bin/$(basename "$(dirname "$f")").exe"; done
          ls -la extension/bin

      - run: npm --prefix extension install
      - run: npm --prefix extension run compile
      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies --out cymose-code.vsix
        working-directory: extension

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/cymose-code.vsix
          if-no-files-found: error

      # Publishing needs a Marketplace PAT in the repo's secrets as VSCE_PAT.
      # Skipped rather than failed when it isn't set, so the release still
      # happens and the vsix is still attached for manual upload.
      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/') && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath cymose-code.vsix
        working-directory: extension

  publish:
    name: github release
    runs-on: ubuntu-latest
    needs: [binaries, extension]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.vsix' \) -exec cp {} release/ \;
          # Checksums, because the install script fetches over the network and
          # "it downloaded something" is not the same as "it downloaded this".
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # A prerelease until 0.1 stops being a beta — it keeps the install
          # script's "latest" pointing at the last stable one.
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
